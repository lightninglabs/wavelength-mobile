name: Wavelength

options:
  bundleIdPrefix: engineering.lightning.wavewalletdk
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  WalletKit:
    # The local Swift wrapper package. It carries Wavewalletdk.xcframework via a
    # binaryTarget; run ../../scripts/fetch-xcframework.sh first to stage it.
    path: ../WalletKit

targets:
  Wavelength:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: WalletKit
    entitlements:
      path: Wavelength.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.devicecheck.appattest-environment: $(APP_ATTEST_ENVIRONMENT)
    info:
      path: NotificationInfo.plist
      properties:
        CFBundleDisplayName: Wavelength
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSCameraUsageDescription: Scan Lightning invoices and Bitcoin payment QR codes.
        NSFaceIDUsageDescription: Unlock your Wavelength wallet.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [engineering.lightning.wavelength.wallet.maintenance]
        WavelengthNotificationRelays: {}
    settings:
      configs:
        Debug:
          APNS_ENVIRONMENT: development
          APP_ATTEST_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
          APP_ATTEST_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.lightning.wavelength.wallet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Wavelength
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  WavelengthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - package: WalletKit
      - target: Wavelength
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.lightning.wavelength.wallet.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

  WavelengthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Wavelength
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.lightning.wavelength.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  Wavelength:
    build:
      targets:
        Wavelength: all
        WavelengthTests: [test]
        WavelengthUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WavelengthTests
        - WavelengthUITests
    archive:
      config: Release
