name: WalletdkSample

options:
  bundleIdPrefix: engineering.lightning.walletdk
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  WalletKit:
    # The local Swift wrapper package. It carries Walletdk.xcframework via a
    # binaryTarget; run ../../scripts/fetch-xcframework.sh first to stage it.
    path: ../WalletKit

targets:
  WalletdkSample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: WalletKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.lightning.walletdk.sample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
